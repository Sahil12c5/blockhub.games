<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="emerald_top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="emerald_left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="emerald_right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded voxel badge for search engines and tab icons -->
  <rect width="64" height="64" rx="14" fill="#090d16" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- 3D Voxel Emerald Block Emblem -->
  <g transform="translate(32, 32)" filter="url(#glow)">
    <!-- Top Face -->
    <path d="M0,-19 L19,-8 L0,3 L-19,-8 Z" fill="url(#emerald_top)" />
    <!-- Left Face -->
    <path d="M-19,-8 L0,3 L0,21 L-19,10 Z" fill="url(#emerald_left)" />
    <!-- Right Face -->
    <path d="M0,3 L19,-8 L19,10 L0,21 Z" fill="url(#emerald_right)" />
    <!-- Internal Glow Highlight -->
    <path d="M0,-11 L8,-6 L0,-1 L-8,-6 Z" fill="#ffffff" opacity="0.65" />
  </g>
</svg>
