<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg_lava-runner-parkour" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg_lava-runner-parkour)" />

  <!-- Voxel Grid Pattern -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <path d="M0,60 L640,60 M0,120 L640,120 M0,180 L640,180 M0,240 L640,240 M0,300 L640,300" />
    <path d="M60,0 L60,360 M120,0 L120,360 M180,0 L180,360 M240,0 L240,360 M300,0 L300,360 M360,0 L360,360 M420,0 L420,360 M480,0 L480,360 M540,0 L540,360 M600,0 L600,360" />
  </g>

  <!-- 3D Voxel Cubes -->
  <g transform="translate(320, 140)">
    <!-- Main Center Cube -->
    <path d="M0,-50 L45,-25 L0,0 L-45,-25 Z" fill="#ea580c" opacity="0.95" />
    <path d="M-45,-25 L0,0 L0,50 L-45,25 Z" fill="#000000" opacity="0.45" />
    <path d="M0,0 L45,-25 L45,25 L0,50 Z" fill="#000000" opacity="0.2" />

    <!-- Left Small Cube -->
    <g transform="translate(-90, 30) scale(0.65)">
      <path d="M0,-50 L45,-25 L0,0 L-45,-25 Z" fill="#ea580c" opacity="0.8" />
      <path d="M-45,-25 L0,0 L0,50 L-45,25 Z" fill="#000000" opacity="0.45" />
      <path d="M0,0 L45,-25 L45,25 L0,50 Z" fill="#000000" opacity="0.2" />
    </g>

    <!-- Right Small Cube -->
    <g transform="translate(90, -20) scale(0.6)">
      <path d="M0,-50 L45,-25 L0,0 L-45,-25 Z" fill="#ea580c" opacity="0.8" />
      <path d="M-45,-25 L0,0 L0,50 L-45,25 Z" fill="#000000" opacity="0.45" />
      <path d="M0,0 L45,-25 L45,25 L0,50 Z" fill="#000000" opacity="0.2" />
    </g>
  </g>

  <!-- Big Category Emoji Icon -->
  <text x="320" y="150" font-size="46" text-anchor="middle" dominant-baseline="central">🔥</text>

  <!-- Category Badge at Top Left -->
  <rect x="24" y="24" width="120" height="30" rx="6" fill="#090d16" fill-opacity="0.85" stroke="#ea580c" stroke-width="1.5" />
  <text x="84" y="44" fill="#ea580c" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">PARKOUR</text>

  <!-- Rating Badge at Top Right -->
  <rect x="546" y="24" width="70" height="30" rx="6" fill="#090d16" fill-opacity="0.85" stroke="#eab308" stroke-width="1" />
  <text x="581" y="44" fill="#facc15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">★ 4.8</text>

  <!-- Lower Title Bar Overlay -->
  <rect x="0" y="250" width="640" height="110" fill="#090d16" fill-opacity="0.9" />
  <line x1="0" y1="250" x2="640" y2="250" stroke="#ea580c" stroke-width="2" />

  <!-- Title Text -->
  <text x="32" y="290" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Lava Runner: Voxel Parkour</text>
  <text x="32" y="322" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Free HTML5 Browser Game • 3D Voxel</text>

  <!-- Play Arrow Prompt on Right -->
  <circle cx="586" cy="305" r="22" fill="#ea580c" />
  <polygon points="580,295 596,305 580,315" fill="#090d16" />
</svg>